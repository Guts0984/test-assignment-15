worker_processes auto;
events { worker_connections 4096; }

http {
  # No query strings in logs: customer links never travel in them, but nothing else needs to be there either.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent rt=$request_time up=$upstream_addr';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 15m;
  # Same JSON error shape as the api, never nginx's HTML page.
  error_page 413 @too_large;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 65s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Both api copies share the DNS name `api` (network alias in docker-compose.yml). The name is resolved at request time
  # through Docker's DNS, so a restarted copy with a new IP is picked up within seconds instead of staying unreachable.
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;
    set $api_upstream http://api:3000;

    location /socket.io/ {
      proxy_pass $api_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Raw inbound mail may carry 10 MB of attachments plus base64 overhead.
    location /api/v1/inbound/ {
      client_max_body_size 30m;
      proxy_pass $api_upstream;
      proxy_read_timeout 60s;
    }

    location @too_large {
      default_type application/json;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large","requestId":"nginx"}}';
    }

    location /api/ {
      proxy_pass $api_upstream;
      proxy_read_timeout 60s;
    }

    location /docs {
      proxy_pass $api_upstream;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
