worker_processes auto;
events { worker_connections 4096; }

http {
  # No query strings in logs: customer links never travel in them, but nothing else needs to be there either.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent rt=$request_time up=$upstream_addr';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 15m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 65s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api {
    server api-1:3000 max_fails=2 fail_timeout=3s;
    server api-2:3000 max_fails=2 fail_timeout=3s;
    keepalive 64;
  }
  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_read_timeout 60s;
    }

    location /docs {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
