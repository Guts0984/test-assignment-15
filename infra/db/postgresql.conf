# Tuning for the seed (3M messages) and the performance budgets. Single-node, 19 GB dev machines and CI.
listen_addresses = '*'
max_connections = 300
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_compression = on
max_wal_size = 4GB
checkpoint_timeout = 15min
random_page_cost = 1.1
log_min_duration_statement = 1000
